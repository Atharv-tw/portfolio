<!doctype html>
<html lang="en" data-env="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f0e8" />
    <!-- title, description, social cards and structured data are generated at
         build time from src/content/site.ts and resume.ts (see vite.config.ts) -->
    <title>Atharv Tiwari</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      document.documentElement.classList.add('js')
    </script>
    <style>
      html { background: #f4f0e8; }
      /* #root ships with a plain-HTML copy of the page for crawlers and for
         visitors without JavaScript. With scripts on, the app replaces it, so
         keep it out of sight until then rather than flashing unstyled text. */
      .prerender { max-width: 44rem; margin: 0 auto; padding: 3rem 1.25rem; font-family: system-ui, sans-serif; line-height: 1.6; color: #0e0e11; }
      .prerender a { color: inherit; text-decoration: underline; }
      .js .prerender { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
